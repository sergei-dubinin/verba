# Локальная разработка: только инфраструктура. Приложение — `pnpm dev`.
# Порты сдвинуты (5433, 6380), чтобы не спорить с другими проектами на машине.
# Продовый compose (app, worker, caddy) — ADR 0002, появится с деплоем.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: verba
      POSTGRES_PASSWORD: verba
      POSTGRES_DB: verba
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:8
    # AOF: без него перезапуск теряет очередь (ADR 0002).
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis:/data

volumes:
  postgres:
  redis:
